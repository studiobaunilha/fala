excluded:
  - .build
  - .swiftpm
  - Package.swift            # manifest SPM: trailing commas são exigidas pelo formato

opt_in_rules:
  - force_unwrapping
  - force_cast
  - force_try
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - empty_count
  - closure_spacing
  - literal_expression_end_indentation
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - trailing_whitespace       # formatador cuida disso

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 200
  error: 300

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length: 2
  excluded:
    - id
    - up
    - ok
    - wk
    - db
